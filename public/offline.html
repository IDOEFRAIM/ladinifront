<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hors ligne — FrontAg</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: #f8fafc;
        color: #0f172a;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(640px, 100%);
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.5;
        color: #334155;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      a,
      button {
        appearance: none;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #0f172a;
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button.primary {
        background: #0f172a;
        color: #ffffff;
        border-color: #0f172a;
      }
      .hint {
        margin-top: 12px;
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" role="main">
        <h1>Vous êtes hors ligne</h1>
        <p>
          La connexion réseau est indisponible. Vous pouvez continuer à consulter certaines pages déjà
          mises en cache, puis réessayer lorsque le réseau revient.
        </p>
        <div class="actions">
          <button class="primary" type="button" onclick="location.reload()">Réessayer</button>
          <a href="/">Retour à l’accueil</a>
        </div>
        <div class="hint">Astuce : vérifiez le Wi‑Fi / la 4G, puis réessayez.</div>
      </div>
    </div>
  </body>
</html>
