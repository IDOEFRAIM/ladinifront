services:
  ladinifront:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - app_env

    env_file:
      - .env

    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - agri_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
secrets:
  app_env:
    file: ./.env

networks:
  agri_net:
    external: true
    name: app_agri_net

